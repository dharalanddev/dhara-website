name: Deploy to MilesWeb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard - REMOTE_PATH must end in public_html
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          case "${REMOTE_PATH%/}" in
            */public_html) echo "REMOTE_PATH ok" ;;
            *) echo "::error::REMOTE_PATH must end in public_html (got '${REMOTE_PATH}')"; exit 1 ;;
          esac

      - name: Guard - Zoho form tokens filled in
        run: |
          if grep -rl "ZOHO_.*_X" --include=*.html . ; then
            echo "::warning::Zoho WebToLead tokens are still placeholders - forms will not reach the CRM yet."
          fi

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "known_hosts entries: $(wc -l < ~/.ssh/known_hosts)"
          ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null && echo "deploy key format OK"

      - name: Test SSH login and remote tools
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p ${SSH_PORT:-22}"
          $SSH "$SSH_USER@$SSH_HOST" "echo LOGIN_OK; cd '${REMOTE_PATH%/}' && pwd; command -v rsync || echo NO_RSYNC"
          echo "--- sftp subsystem check"
          echo pwd | sftp -b - -o BatchMode=yes -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -P "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" || echo "SFTP_FAILED"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          SSH="ssh -o BatchMode=yes -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p ${SSH_PORT:-22}"
          DEST="${REMOTE_PATH%/}/"
          if $SSH "$SSH_USER@$SSH_HOST" "command -v rsync" >/dev/null 2>&1; then
            echo "Deploying with rsync"
            rsync -rlvz --delete --chmod=D755,F644 -e "$SSH" \
              --exclude '.git/' --exclude '.github/' --exclude '.well-known/' \
              --exclude 'cgi-bin/' --exclude '.htaccess' --exclude '.gitignore' \
              --exclude '.DS_Store' --exclude 'README.md' --exclude '_notes/' \
              ./ "$SSH_USER@$SSH_HOST:$DEST"
          else
            echo "No rsync on server - deploying with lftp"
            lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          debug 3
          open -u "$SSH_USER," -p ${SSH_PORT:-22} sftp://$SSH_HOST
          cd "$DEST"
          mirror --reverse --delete --verbose --parallel=4 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .htaccess --exclude-glob .gitignore --exclude-glob .DS_Store --exclude-glob README.md --exclude-glob _notes/ ./ ./
          bye
          EOF
          fi
